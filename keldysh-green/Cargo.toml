[package]
name = "keldysh-green"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Checked dense reference algorithms for real-time nonequilibrium Green functions"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/keldysh-green"
