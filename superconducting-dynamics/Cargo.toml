[package]
name = "superconducting-dynamics"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Gauge-covariant TDGL and Josephson dynamics on checked finite graphs"
license = "MIT"
repository = "https://github.com/MonumentalSystems/commutator-rs"
homepage = "https://commutator.science"
documentation = "https://docs.rs/superconducting-dynamics"
readme = "README.md"
publish = ["crates-io"]
keywords = ["superconductivity", "tdgl", "josephson", "gauge", "physics"]
categories = ["science", "mathematics", "simulation"]
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
num-complex = "0.4.6"


