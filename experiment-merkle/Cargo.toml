[package]
name = "experiment-merkle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Context-bound Merkle commitments and spot checks for distributed experiments"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/experiment-merkle"
readme = "README.md"
publish = ["crates-io"]
keywords = ["merkle", "verification", "distributed", "experiments", "sha256"]
categories = ["cryptography", "science"]
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "tests/fixtures/*.json",
    "tests/fixtures/SHA256SUMS",
    "Cargo.toml",
    "README.md",
    "SPEC.md",
    "PROVENANCE.md",
    "LICENSE",
]

[dependencies]
experiment-core = { version = "0.1.0", path = "../experiment-core" }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1.0"
